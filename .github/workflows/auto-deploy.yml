name: Auto deploy production

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  actions: write
  contents: read

concurrency:
  group: auto-deploy-production
  cancel-in-progress: true

jobs:
  trigger-deploy:
    name: Trigger production deployment
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Dispatch tested main revision
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          CURRENT_SHA="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          if [ "$CURRENT_SHA" != "$TESTED_SHA" ]; then
            echo "main advanced from tested $TESTED_SHA to $CURRENT_SHA; the newer push CI will own production deployment."
            exit 0
          fi
          gh workflow run ci.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f deploy_to_vps=true
