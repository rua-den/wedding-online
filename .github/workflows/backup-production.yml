name: Backup production

on:
  schedule:
    - cron: "15 20 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup-production
  cancel-in-progress: false

jobs:
  backup:
    name: Snapshot production data
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      VPS_PORT: ${{ vars.VPS_PORT || '22' }}
      VPS_APP_ROOT: ${{ vars.VPS_APP_ROOT }}

    steps:
      - name: Validate and configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST" || { echo "Missing production secret VPS_HOST"; exit 1; }
          test -n "$VPS_USER" || { echo "Missing production secret VPS_USER"; exit 1; }
          test -n "$VPS_SSH_PRIVATE_KEY" || { echo "Missing production secret VPS_SSH_PRIVATE_KEY"; exit 1; }
          test -n "$VPS_KNOWN_HOSTS" || { echo "Missing production secret VPS_KNOWN_HOSTS"; exit 1; }
          test -n "$VPS_APP_ROOT" || { echo "Missing production variable VPS_APP_ROOT"; exit 1; }
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_deploy"
          chmod 600 "$HOME/.ssh/id_deploy"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Create verified VPS snapshot
        id: snapshot
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          SNAPSHOT_ID="$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_RUN_ID}"
          echo "id=$SNAPSHOT_ID" >> "$GITHUB_OUTPUT"
          ssh -i "$HOME/.ssh/id_deploy" -p "$VPS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" bash -s -- "$VPS_APP_ROOT" "$SNAPSHOT_ID" <<'REMOTE'
          set -euo pipefail
          umask 077
          APP_ROOT="$1"
          SNAPSHOT_ID="$2"
          SHARED="$APP_ROOT/shared"
          CURRENT="$APP_ROOT/current"
          BACKUP_ROOT="$SHARED/data/backups/scheduled"
          SNAPSHOT="$BACKUP_ROOT/$SNAPSHOT_ID"

          test -L "$CURRENT" || { echo "Missing current production release"; exit 1; }
          command -v node >/dev/null || { echo "Node.js is missing"; exit 1; }
          test -f "$SHARED/.env" || { echo "Missing production .env"; exit 1; }
          test -d "$SHARED/uploads" || { echo "Missing shared uploads"; exit 1; }
          mkdir -p "$BACKUP_ROOT" "$SNAPSHOT"
          chmod 700 "$SHARED/data/backups" "$BACKUP_ROOT" "$SNAPSHOT"

          REVISION="unknown"
          if [ -f "$APP_ROOT/DEPLOYED_REVISION" ]; then REVISION="$(tr -d '\r\n' < "$APP_ROOT/DEPLOYED_REVISION")"; fi
          cd "$CURRENT"
          BACKUP_REVISION="$REVISION" node --input-type=commonjs - "$SHARED/.env" "$SNAPSHOT" <<'NODE'
          const BetterSqlite3 = require("better-sqlite3");
          const fs = require("node:fs");
          const path = require("node:path");
          const [envPath, outputDirectory] = process.argv.slice(2);
          process.loadEnvFile(envPath);
          const databasePath = path.resolve(process.env.SQLITE_PATH || "data/wedding.sqlite");
          if (!fs.existsSync(databasePath)) throw new Error(`Production SQLite database is missing: ${databasePath}`);
          const backupPath = path.join(outputDirectory, "wedding.sqlite");
          const database = new BetterSqlite3(databasePath);
          database.pragma("foreign_keys = ON");
          database.pragma("wal_checkpoint(TRUNCATE)");
          database.backup(backupPath).then(() => {
            database.close();
            const backup = new BetterSqlite3(backupPath, { readonly: true, fileMustExist: true });
            const integrity = backup.pragma("integrity_check", { simple: true });
            backup.close();
            if (integrity !== "ok") throw new Error(`SQLite backup integrity check failed: ${integrity}`);
            fs.chmodSync(backupPath, 0o600);
            fs.writeFileSync(path.join(outputDirectory, "metadata.json"), `${JSON.stringify({ createdAt: new Date().toISOString(), revision: process.env.BACKUP_REVISION, integrity: "ok" }, null, 2)}\n`, { mode: 0o600 });
          }).catch((error) => { try { database.close(); } catch {} console.error(error); process.exit(1); });
          NODE
          tar -C "$SHARED" -czf "$SNAPSHOT/uploads.tgz" uploads
          chmod 600 "$SNAPSHOT/uploads.tgz" "$SNAPSHOT/wedding.sqlite" "$SNAPSHOT/metadata.json"
          printf '%s\n' "$REVISION" > "$SNAPSHOT/COMPLETE"
          chmod 600 "$SNAPSHOT/COMPLETE"

          ls -1dt "$BACKUP_ROOT"/* 2>/dev/null | tail -n +15 | while IFS= read -r old_snapshot; do
            rm -rf "$old_snapshot"
          done
          echo "Scheduled production snapshot completed: $SNAPSHOT_ID"
          REMOTE

      - name: Detect offsite backup configuration
        id: offsite
        env:
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          if [ -n "$BACKUP_ENCRYPTION_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download and encrypt offsite snapshot
        if: steps.offsite.outputs.enabled == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          SNAPSHOT_ID: ${{ steps.snapshot.outputs.id }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          mkdir -m 700 offsite-plain
          scp -i "$HOME/.ssh/id_deploy" -P "$VPS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -r \
            "$VPS_USER@$VPS_HOST:$VPS_APP_ROOT/shared/data/backups/scheduled/$SNAPSHOT_ID" offsite-plain/
          tar -C offsite-plain -czf production-backup.tar.gz "$SNAPSHOT_ID"
          openssl enc -aes-256-cbc -pbkdf2 -salt \
            -in production-backup.tar.gz \
            -out "production-backup-$SNAPSHOT_ID.tar.gz.enc" \
            -pass env:BACKUP_ENCRYPTION_KEY
          rm -rf offsite-plain production-backup.tar.gz

      - name: Upload encrypted offsite backup
        if: steps.offsite.outputs.enabled == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: production-backup-${{ steps.snapshot.outputs.id }}
          path: production-backup-${{ steps.snapshot.outputs.id }}.tar.gz.enc
          if-no-files-found: error
          retention-days: 30

      - name: Backup summary
        env:
          SNAPSHOT_ID: ${{ steps.snapshot.outputs.id }}
          OFFSITE_ENABLED: ${{ steps.offsite.outputs.enabled }}
        run: |
          set -euo pipefail
          {
            echo "## Production backup"
            echo
            echo "✅ Verified VPS snapshot: \`$SNAPSHOT_ID\` (SQLite integrity check + uploads archive)."
            if [ "$OFFSITE_ENABLED" = "true" ]; then
              echo "✅ Encrypted offsite artifact uploaded with 30-day retention."
            else
              echo "⚠️ Offsite artifact skipped because \`BACKUP_ENCRYPTION_KEY\` is not configured. VPS snapshot is still complete."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
