name: CI

on:
  push:
    branches: [main]
    tags: [production-readiness/*]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy_to_vps:
        description: Build an ARM64 production release and deploy it after CI passes
        required: false
        default: false
        type: boolean
      verify_production:
        description: Run a read-only production readiness audit after CI passes
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  CI: true
  NEXT_TELEMETRY_DISABLED: 1

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Unit, lint, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore Next.js build cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Unit tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm run test:e2e

      - name: Upload visual smoke previews
        if: success()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: visual-previews
          path: visual-previews/
          if-no-files-found: error
          retention-days: 1

      - name: Upload Playwright HTML report on failure
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: error
          retention-days: 3

      - name: Upload screenshots and traces on failure
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: error
          retention-days: 3

  visual-summary:
    name: Visual smoke summary
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-slim
    needs: e2e
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Download visual previews
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: visual-previews
          path: visual-previews

      - name: Publish latest previews
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir visual-publish
          cp -R visual-previews/. visual-publish/
          cd visual-publish
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b ci-visuals
          cat > README.md <<EOF
          # Latest CI visual smoke previews

          Generated from commit ${GITHUB_SHA} by Actions run ${GITHUB_RUN_ID}.
          This branch is force-replaced on each successful push to main, so it keeps only the latest visual smoke screenshots.
          EOF
          git add .
          git commit -m "ci: update visual previews for ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin ci-visuals

      - name: Show previews in Actions summary
        run: |
          RAW_BASE="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/ci-visuals"
          RUN_QUERY="run=${GITHUB_RUN_ID}"
          {
            echo "## Wedding invitation visual smoke"
            echo
            echo "Commit \`${GITHUB_SHA:0:7}\` · Playwright passed before these screenshots were published."
            echo
            echo '<table><tr><th>Home · Mobile</th><th>Home · Desktop</th></tr><tr>'
            echo "<td><a href=\"${RAW_BASE}/home-mobile.png?${RUN_QUERY}\"><img src=\"${RAW_BASE}/home-mobile.png?${RUN_QUERY}\" width=\"300\" alt=\"Home mobile preview\"></a></td>"
            echo "<td><a href=\"${RAW_BASE}/home-desktop.png?${RUN_QUERY}\"><img src=\"${RAW_BASE}/home-desktop.png?${RUN_QUERY}\" width=\"480\" alt=\"Home desktop preview\"></a></td>"
            echo '</tr><tr><th>Countdown · Mobile</th><th>Countdown · Desktop</th></tr><tr>'
            echo "<td><a href=\"${RAW_BASE}/countdown-mobile.png?${RUN_QUERY}\"><img src=\"${RAW_BASE}/countdown-mobile.png?${RUN_QUERY}\" width=\"300\" alt=\"Countdown mobile preview\"></a></td>"
            echo "<td><a href=\"${RAW_BASE}/countdown-desktop.png?${RUN_QUERY}\"><img src=\"${RAW_BASE}/countdown-desktop.png?${RUN_QUERY}\" width=\"480\" alt=\"Countdown desktop preview\"></a></td>"
            echo '</tr><tr><th>Guest cover · Mobile</th><th>Guest opened · Mobile</th></tr><tr>'
            echo "<td><a href=\"${RAW_BASE}/personal-cover-mobile.png?${RUN_QUERY}\"><img src=\"${RAW_BASE}/personal-cover-mobile.png?${RUN_QUERY}\" width=\"300\" alt=\"Personal cover mobile preview\"></a></td>"
            echo "<td><a href=\"${RAW_BASE}/personal-open-mobile.png?${RUN_QUERY}\"><img src=\"${RAW_BASE}/personal-open-mobile.png?${RUN_QUERY}\" width=\"300\" alt=\"Personal invitation opened mobile preview\"></a></td>"
            echo '</tr></table>'
            echo
            echo "Detailed Playwright report/screenshots/traces are uploaded only when E2E fails."
          } >> "$GITHUB_STEP_SUMMARY"

  production-readiness:
    name: Read-only production readiness audit
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.verify_production && !inputs.deploy_to_vps) ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/production-readiness/'))
    runs-on: ubuntu-latest
    needs: e2e
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
    env:
      VPS_PORT: ${{ vars.VPS_PORT || '22' }}
      VPS_APP_ROOT: ${{ vars.VPS_APP_ROOT }}
      VPS_APP_PORT: ${{ vars.VPS_APP_PORT || '3000' }}

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Check automatic deployment gate
        env:
          CD_ENABLED: ${{ vars.CD_ENABLED }}
        run: |
          set -euo pipefail
          if [ "${CD_ENABLED:-}" = "true" ]; then
            echo "Production readiness audit requires CD_ENABLED to be off."
            exit 1
          fi

      - name: Audit production VPS without mutation
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST" || { echo "Missing production secret VPS_HOST"; exit 1; }
          test -n "$VPS_USER" || { echo "Missing production secret VPS_USER"; exit 1; }
          test -n "$VPS_SSH_PRIVATE_KEY" || { echo "Missing production secret VPS_SSH_PRIVATE_KEY"; exit 1; }
          test -n "$VPS_KNOWN_HOSTS" || { echo "Missing production secret VPS_KNOWN_HOSTS"; exit 1; }
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9._:-]+$ ]] || { echo "VPS_HOST contains unsupported characters"; exit 1; }
          [[ "$VPS_USER" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "VPS_USER contains unsupported characters"; exit 1; }
          case "$VPS_APP_ROOT" in /*) ;; *) echo "VPS_APP_ROOT must be an absolute path"; exit 1 ;; esac
          test "$VPS_APP_ROOT" != "/" || { echo "VPS_APP_ROOT cannot be /"; exit 1; }
          [[ "$VPS_APP_ROOT" != *$'\n'* && "$VPS_APP_ROOT" != *$'\r'* ]] || { echo "VPS_APP_ROOT contains a line break"; exit 1; }
          for configured_port in "$VPS_PORT" "$VPS_APP_PORT"; do
            [[ "$configured_port" =~ ^[0-9]{1,5}$ ]] || { echo "Configured ports must be numeric"; exit 1; }
            (( 10#$configured_port >= 1 && 10#$configured_port <= 65535 )) || { echo "Configured ports must be between 1 and 65535"; exit 1; }
          done

          umask 077
          SSH_DIR="$(mktemp -d)"
          trap 'rm -rf "$SSH_DIR"' EXIT
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$SSH_DIR/id_deploy"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$SSH_DIR/known_hosts"
          SSH=(ssh -i "$SSH_DIR/id_deploy" -p "$VPS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$SSH_DIR/known_hosts")
          REMOTE="$VPS_USER@$VPS_HOST"
          printf -v root_arg '%q' "$VPS_APP_ROOT"
          printf -v port_arg '%q' "$VPS_APP_PORT"
          "${SSH[@]}" "$REMOTE" "bash -s -- $root_arg $port_arg" <<'REMOTE_AUDIT'
          set -euo pipefail
          APP_ROOT_INPUT="$1"
          APP_PORT="$2"
          case "$APP_ROOT_INPUT" in /*) ;; *) echo "VPS_APP_ROOT must be absolute"; exit 1 ;; esac
          [ "$APP_ROOT_INPUT" != "/" ] || { echo "VPS_APP_ROOT cannot be /"; exit 1; }
          [[ "$APP_PORT" =~ ^[0-9]{1,5}$ ]] || { echo "VPS_APP_PORT must be numeric"; exit 1; }
          (( 10#$APP_PORT >= 1 && 10#$APP_PORT <= 65535 )) || { echo "VPS_APP_PORT is out of range"; exit 1; }
          APP_ROOT="$(realpath -e -- "$APP_ROOT_INPUT")"
          SHARED="$APP_ROOT/shared"
          CURRENT="$(realpath -e -- "$APP_ROOT/current")"
          case "$CURRENT" in "$APP_ROOT"/releases/*) ;; *) echo "current does not resolve under releases"; exit 1 ;; esac
          [[ -d "$CURRENT" ]] || { echo "current release directory is missing"; exit 1; }
          REVISION="$(tr -d '\r\n' < "$CURRENT/REVISION")"
          DEPLOYED_REVISION="$(tr -d '\r\n' < "$APP_ROOT/DEPLOYED_REVISION")"
          [[ "$REVISION" =~ ^[0-9a-f]{40}$ ]] || { echo "Current release REVISION is invalid"; exit 1; }
          [[ "$DEPLOYED_REVISION" =~ ^[0-9a-f]{40}$ && "$REVISION" = "$DEPLOYED_REVISION" ]] || { echo "DEPLOYED_REVISION does not match current release"; exit 1; }
          SHARED_REAL="$(realpath -e -- "$SHARED")"
          [[ "$(realpath -e -- "$CURRENT/.env")" = "$SHARED_REAL/.env" ]] || { echo "Release .env does not resolve to shared .env"; exit 1; }
          [[ "$(realpath -e -- "$CURRENT/data")" = "$SHARED_REAL/data" ]] || { echo "Release data does not resolve to shared data"; exit 1; }
          [[ "$(realpath -e -- "$CURRENT/public/uploads")" = "$SHARED_REAL/uploads" ]] || { echo "Release uploads do not resolve to shared uploads"; exit 1; }
          [[ -d "$SHARED_REAL/data/backups" ]] || { echo "Shared backup directory is missing"; exit 1; }
          [[ "$(realpath -e -- "$SHARED_REAL/data/backups")" = "$SHARED_REAL/data/backups" ]] || { echo "Shared backup directory path is not canonical"; exit 1; }
          command -v curl >/dev/null && command -v ss >/dev/null || { echo "Required read-only audit commands are unavailable"; exit 1; }
          # Inspect existing PM2 and /proc metadata directly. Do not invoke the PM2 CLI:
          # its client initializes PM2_HOME and may start a daemon on an unhealthy host.
          PM2_HOME="${PM2_HOME:-$HOME/.pm2}"
          PROC_ROOT="/proc"
          PM2_DAEMON_PID_FILE="$PM2_HOME/pm2.pid"
          [[ -d "$PM2_HOME" && -f "$PM2_DAEMON_PID_FILE" ]] || { echo "PM2 daemon metadata is missing"; exit 1; }
          PM2_DAEMON_PID="$(tr -d '\r\n' < "$PM2_DAEMON_PID_FILE")"
          [[ "$PM2_DAEMON_PID" =~ ^[1-9][0-9]*$ && -d "$PROC_ROOT/$PM2_DAEMON_PID" && -r "$PROC_ROOT/$PM2_DAEMON_PID/cmdline" ]] || { echo "PM2 daemon is not running"; exit 1; }
          PM2_DAEMON_CMDLINE="$(tr '\0' ' ' < "$PROC_ROOT/$PM2_DAEMON_PID/cmdline")"
          [[ "$PM2_DAEMON_CMDLINE" =~ PM2[[:space:]]v[^:]+:[[:space:]]God[[:space:]]Daemon || "$PM2_DAEMON_CMDLINE" =~ pm2/lib/Daemon\.js ]] || { echo "PM2 daemon process identity is invalid"; exit 1; }
          shopt -s nullglob
          APP_PID_FILES=("$PM2_HOME/pids/huy-nhi-wedding-"*.pid)
          [[ "${#APP_PID_FILES[@]}" -eq 1 ]] || { echo "PM2 production PID metadata is missing or ambiguous"; exit 1; }
          APP_PID_FILE_NAME="${APP_PID_FILES[0]##*/}"
          [[ "$APP_PID_FILE_NAME" =~ ^huy-nhi-wedding-[0-9]+\.pid$ ]] || { echo "PM2 production PID metadata name is invalid"; exit 1; }
          APP_PID="$(tr -d '\r\n' < "${APP_PID_FILES[0]}")"
          [[ "$APP_PID" =~ ^[1-9][0-9]*$ && "$APP_PID" != "$PM2_DAEMON_PID" && -d "$PROC_ROOT/$APP_PID" && -r "$PROC_ROOT/$APP_PID/status" && -e "$PROC_ROOT/$APP_PID/cwd" ]] || { echo "PM2 production process is not running"; exit 1; }
          APP_STATE="$(awk '/^State:/ { print $2 }' "$PROC_ROOT/$APP_PID/status")"
          [[ -n "$APP_STATE" && "$APP_STATE" != Z && "$APP_STATE" != X ]] || { echo "PM2 production process is not live"; exit 1; }
          APP_PARENT_PID="$(awk '/^PPid:/ { print $2 }' "$PROC_ROOT/$APP_PID/status")"
          [[ "$APP_PARENT_PID" = "$PM2_DAEMON_PID" ]] || { echo "PM2 production process parent does not match daemon"; exit 1; }
          [[ "$(readlink -f -- "$PROC_ROOT/$APP_PID/cwd")" = "$CURRENT" ]] || { echo "PM2 process cwd does not match current release"; exit 1; }
          LISTENERS="$(ss -ltnH "sport = :$APP_PORT")"
          [[ -n "$LISTENERS" ]] || { echo "Application has no localhost listener"; exit 1; }
          while IFS= read -r listener; do
            local_address="$(awk '{print $4}' <<< "$listener")"
            [[ "$local_address" = "127.0.0.1:$APP_PORT" ]] || { echo "Application listener is not loopback-only"; exit 1; }
          done <<< "$LISTENERS"
          curl --fail --silent --show-error "http://127.0.0.1:$APP_PORT/" >/dev/null || { echo "Localhost health check failed"; exit 1; }
          printf 'Production topology PASS; revision=%s; listener=127.0.0.1:%s\n' "$REVISION" "$APP_PORT"
          REMOTE_AUDIT

          printf -v current_arg '%q' "$VPS_APP_ROOT/current"
          printf -v expected_data_arg '%q' "$VPS_APP_ROOT/shared/data"
          printf -v expected_uploads_arg '%q' "$VPS_APP_ROOT/shared/uploads"
          remote_command="cd -- $current_arg && EXPECTED_SHARED_DATA=$expected_data_arg EXPECTED_SHARED_UPLOADS=$expected_uploads_arg node --env-file=.env --input-type=commonjs - audit"
          "${SSH[@]}" "$REMOTE" "$remote_command" < deploy/verify-persistent-state.cjs

  release-arm64:
    name: Build ARM64 production release
    if: >-
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'push' && vars.CD_ENABLED == 'true') ||
       (github.event_name == 'workflow_dispatch' && inputs.deploy_to_vps))
    runs-on: ubuntu-24.04-arm
    needs: e2e
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build standalone release
        run: npm run build

      - name: Assemble release
        run: |
          set -euo pipefail
          rm -rf release production-release.tgz
          mkdir -p release/.next/static release/public
          cp -a .next/standalone/. release/
          cp -a .next/static/. release/.next/static/
          if [ -d public ]; then cp -a public/. release/public/; fi
          rm -rf release/public/uploads
          test -f release/node_modules/better-sqlite3/package.json || {
            echo "Production release is missing better-sqlite3"
            exit 1
          }
          cp deploy/ecosystem-release.cjs release/ecosystem.config.cjs
          cp deploy/verify-persistent-state.cjs release/verify-persistent-state.cjs
          node --check release/verify-persistent-state.cjs
          printf '%s\n' "$GITHUB_SHA" > release/REVISION
          tar -C release -czf production-release.tgz .

      - name: Smoke test ARM64 standalone release
        run: |
          set -euo pipefail
          ISOLATED_RELEASE="$RUNNER_TEMP/wedding-release"
          rm -rf "$ISOLATED_RELEASE"
          mkdir -p "$ISOLATED_RELEASE" "$RUNNER_TEMP/wedding-data" "$RUNNER_TEMP/wedding-uploads"
          cp -a release/. "$ISOLATED_RELEASE/"
          cd "$ISOLATED_RELEASE"
          HOSTNAME=127.0.0.1 \
          PORT=3100 \
          SQLITE_PATH="$RUNNER_TEMP/wedding-data/wedding.sqlite" \
          SQLITE_BACKUP_DIRECTORY="$RUNNER_TEMP/wedding-data/backups" \
          MEDIA_UPLOAD_DIRECTORY="$RUNNER_TEMP/wedding-uploads" \
          PUBLIC_SITE_URL="http://127.0.0.1:3100" \
          ADMIN_SESSION_SECRET="ci-standalone-smoke-session-secret-000000000000" \
          node server.js > "$RUNNER_TEMP/standalone.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error http://127.0.0.1:3100/ > /dev/null; then
              exit 0
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              cat "$RUNNER_TEMP/standalone.log"
              exit 1
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/standalone.log"
          exit 1

      - name: Upload production release
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: production-release
          path: production-release.tgz
          if-no-files-found: error
          retention-days: 1

  deploy-production:
    name: Deploy production VPS
    if: >-
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'push' && vars.CD_ENABLED == 'true') ||
       (github.event_name == 'workflow_dispatch' && inputs.deploy_to_vps))
    runs-on: ubuntu-latest
    needs: release-arm64
    timeout-minutes: 10
    environment: production
    env:
      VPS_PORT: ${{ vars.VPS_PORT || '22' }}
      VPS_APP_ROOT: ${{ vars.VPS_APP_ROOT }}
      VPS_APP_PORT: ${{ vars.VPS_APP_PORT || '3000' }}

    steps:
      - name: Download production release
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: production-release
          path: deploy-artifact

      - name: Validate deployment configuration
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST" || { echo "Missing production secret VPS_HOST"; exit 1; }
          test -n "$VPS_USER" || { echo "Missing production secret VPS_USER"; exit 1; }
          test -n "$VPS_SSH_PRIVATE_KEY" || { echo "Missing production secret VPS_SSH_PRIVATE_KEY"; exit 1; }
          test -n "$VPS_KNOWN_HOSTS" || { echo "Missing production secret VPS_KNOWN_HOSTS"; exit 1; }
          test -n "$VPS_APP_ROOT" || { echo "Missing production variable VPS_APP_ROOT"; exit 1; }
          case "$VPS_APP_ROOT" in
            /*) ;;
            *) echo "VPS_APP_ROOT must be an absolute path"; exit 1 ;;
          esac
          test "$VPS_APP_ROOT" != "/" || { echo "VPS_APP_ROOT cannot be /"; exit 1; }

      - name: Configure SSH
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_deploy"
          chmod 600 "$HOME/.ssh/id_deploy"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Upload release to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          SSH=(ssh -i "$HOME/.ssh/id_deploy" -p "$VPS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes)
          SCP=(scp -i "$HOME/.ssh/id_deploy" -P "$VPS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes)
          "${SSH[@]}" "$VPS_USER@$VPS_HOST" "mkdir -p '$VPS_APP_ROOT/incoming'"
          "${SCP[@]}" deploy-artifact/production-release.tgz "$VPS_USER@$VPS_HOST:$VPS_APP_ROOT/incoming/$GITHUB_SHA.tgz"

      - name: Activate release and health check
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/id_deploy" -p "$VPS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" bash -s -- "$VPS_APP_ROOT" "$GITHUB_SHA" "$VPS_APP_PORT" <<'REMOTE'
          set -euo pipefail
          umask 077
          APP_ROOT="$1"
          RELEASE_ID="$2"
          APP_PORT="$3"
          APP_NAME="huy-nhi-wedding"
          SHARED="$APP_ROOT/shared"
          RELEASE="$APP_ROOT/releases/$RELEASE_ID"
          ARCHIVE="$APP_ROOT/incoming/$RELEASE_ID.tgz"
          STATE_FILE="$APP_ROOT/incoming/$RELEASE_ID-persistent-state.json"

          health_check() {
            for attempt in $(seq 1 20); do
              if curl --fail --silent --show-error "http://127.0.0.1:$APP_PORT/" > /dev/null; then
                return 0
              fi
              sleep 1
            done
            return 1
          }

          verify_persistent_state() {
            mode="$1"
            target="$2"
            (
              cd "$target" || exit 1
              EXPECTED_SHARED_DATA="$SHARED/data" \
              EXPECTED_SHARED_UPLOADS="$SHARED/uploads" \
              DEPLOY_RELEASE_ID="$RELEASE_ID" \
              node --env-file=.env verify-persistent-state.cjs "$mode" "$STATE_FILE"
            )
          }

          start_release() {
            target="$1"
            pm2 delete "$APP_NAME" >/dev/null 2>&1 || true
            cd "$target" || return 1
            PORT="$APP_PORT" HOSTNAME="127.0.0.1" pm2 start ecosystem.config.cjs --update-env
          }

          switch_current() {
            target="$1"
            link="$APP_ROOT/.current-$RELEASE_ID-$$"
            rm -f "$link"
            ln -s "$target" "$link"
            rm -f "$APP_ROOT/current"
            mv -T "$link" "$APP_ROOT/current"
          }

          test -f "$SHARED/.env" || {
            echo "Missing $SHARED/.env. Run the one-time VPS shared-storage bootstrap before enabling CD."
            exit 1
          }
          test -d "$SHARED/data" || { echo "Missing $SHARED/data"; exit 1; }
          test -d "$SHARED/uploads" || { echo "Missing $SHARED/uploads"; exit 1; }
          command -v node >/dev/null || { echo "Node.js is not installed on VPS"; exit 1; }
          command -v pm2 >/dev/null || { echo "PM2 is not installed on VPS"; exit 1; }
          command -v curl >/dev/null || { echo "curl is not installed on VPS"; exit 1; }

          if [ -e "$APP_ROOT/current" ] && [ ! -L "$APP_ROOT/current" ]; then
            echo "$APP_ROOT/current must be a symlink"
            exit 1
          fi

          chmod 600 "$SHARED/.env"
          chmod 700 "$SHARED" "$SHARED/data" "$SHARED/uploads"
          mkdir -p "$SHARED/data/backups" "$APP_ROOT/releases"
          chmod 700 "$SHARED/data/backups"

          PREVIOUS=""
          PREVIOUS_REVISION=""

          if [ -f "$APP_ROOT/DEPLOYED_REVISION" ]; then
            PREVIOUS_REVISION="$(tr -d '\r\n' < "$APP_ROOT/DEPLOYED_REVISION")"
            PREVIOUS_CANDIDATE="$APP_ROOT/releases/$PREVIOUS_REVISION"
            if [ -n "$PREVIOUS_REVISION" ] && [ -d "$PREVIOUS_CANDIDATE" ] && [ "$PREVIOUS_CANDIDATE" != "$RELEASE" ]; then
              PREVIOUS="$PREVIOUS_CANDIDATE"
            fi
          fi

          if [ -z "$PREVIOUS" ] && [ -L "$APP_ROOT/current" ]; then
            CURRENT_TARGET="$(readlink -f "$APP_ROOT/current" || true)"
            case "$CURRENT_TARGET" in
              "$APP_ROOT"/releases/*)
                if [ -d "$CURRENT_TARGET" ] && [ "$CURRENT_TARGET" != "$RELEASE" ]; then
                  PREVIOUS="$CURRENT_TARGET"
                  PREVIOUS_REVISION="$(basename "$CURRENT_TARGET")"
                fi
                ;;
            esac
          fi

          if [ -z "$PREVIOUS" ]; then
            RUNNING_PID="$(pm2 pid "$APP_NAME" 2>/dev/null | head -n 1 || true)"
            if [ -n "$RUNNING_PID" ] && [ "$RUNNING_PID" != "0" ] && [ -e "/proc/$RUNNING_PID/cwd" ]; then
              RUNNING_CWD="$(readlink -f "/proc/$RUNNING_PID/cwd" || true)"
              case "$RUNNING_CWD" in
                "$APP_ROOT"/releases/*)
                  if [ -d "$RUNNING_CWD" ] && [ "$RUNNING_CWD" != "$RELEASE" ]; then
                    PREVIOUS="$RUNNING_CWD"
                    PREVIOUS_REVISION="$(basename "$RUNNING_CWD")"
                    echo "Recovered rollback target from running PM2 process: $PREVIOUS_REVISION"
                  fi
                  ;;
              esac
            fi
          fi

          LEGACY_CONFIG=""
          if [ -z "$PREVIOUS" ] && [ -f "$APP_ROOT/ecosystem.config.cjs" ]; then
            LEGACY_CONFIG="$APP_ROOT/ecosystem.config.cjs"
          fi

          ACTIVE_REVISION=""
          if [ -f "$APP_ROOT/DEPLOYED_REVISION" ]; then
            ACTIVE_REVISION="$(tr -d '\r\n' < "$APP_ROOT/DEPLOYED_REVISION")"
          fi
          if [ "$ACTIVE_REVISION" = "$RELEASE_ID" ] && [ -d "$RELEASE" ] && health_check; then
            echo "Release $RELEASE_ID is already healthy; deployment is idempotent."
            rm -f "$ARCHIVE" "$STATE_FILE"
            switch_current "$RELEASE"
            pm2 save
            exit 0
          fi

          STAGING="$APP_ROOT/releases/.staging-$RELEASE_ID-$$"
          rm -rf "$STAGING"
          mkdir -p "$STAGING"
          tar -xzf "$ARCHIVE" -C "$STAGING"
          rm -f "$ARCHIVE"

          rm -rf "$STAGING/data" "$STAGING/public/uploads" "$STAGING/.env"
          mkdir -p "$STAGING/public"
          ln -s "$SHARED/data" "$STAGING/data"
          ln -s "$SHARED/uploads" "$STAGING/public/uploads"
          ln -s "$SHARED/.env" "$STAGING/.env"

          rm -rf "$RELEASE"
          mv "$STAGING" "$RELEASE"

          if ! verify_persistent_state snapshot "$RELEASE"; then
            echo "Persistent state preflight failed; existing production process was left untouched."
            exit 1
          fi

          DEPLOY_OK=0
          if start_release "$RELEASE"; then
            if health_check; then
              if verify_persistent_state verify "$RELEASE"; then
                DEPLOY_OK=1
              else
                echo "Persistent state changed unexpectedly during activation."
              fi
            fi
          fi

          if [ "$DEPLOY_OK" -ne 1 ]; then
            echo "New release failed activation, health check, or persistent-state verification; rolling back code."
            pm2 logs "$APP_NAME" --lines 80 --nostream || true
            pm2 delete "$APP_NAME" >/dev/null 2>&1 || true

            ROLLBACK_OK=0
            if [ -n "$PREVIOUS" ]; then
              echo "Rolling back to release $PREVIOUS_REVISION"
              switch_current "$PREVIOUS"
              if start_release "$PREVIOUS" && health_check; then
                printf '%s\n' "$PREVIOUS_REVISION" > "$APP_ROOT/DEPLOYED_REVISION"
                pm2 save
                ROLLBACK_OK=1
              fi
            elif [ -n "$LEGACY_CONFIG" ]; then
              echo "Rolling back to legacy PM2 configuration"
              rm -f "$APP_ROOT/current"
              cd "$APP_ROOT"
              if pm2 start "$LEGACY_CONFIG" --update-env && health_check; then
                rm -f "$APP_ROOT/DEPLOYED_REVISION"
                pm2 save
                ROLLBACK_OK=1
              fi
            fi

            if [ "$ROLLBACK_OK" -eq 1 ]; then
              echo "Rollback health check passed. The pre-deploy SQLite backup is retained for recovery if state verification failed."
              exit 1
            fi

            echo "CRITICAL: deployment failed and no healthy rollback target could be restored."
            pm2 status || true
            exit 2
          fi

          switch_current "$RELEASE"
          printf '%s\n' "$RELEASE_ID" > "$APP_ROOT/DEPLOYED_REVISION"
          pm2 save
          rm -f "$STATE_FILE"

          ls -1dt "$APP_ROOT"/releases/* 2>/dev/null | tail -n +6 | while IFS= read -r old_release; do
            [ "$old_release" = "$PREVIOUS" ] && continue
            [ "$old_release" = "$RELEASE" ] && continue
            rm -rf "$old_release"
          done
          REMOTE

      - name: Deployment summary
        run: |
          {
            echo "## Production deployment"
            echo
            echo "✅ Deployed commit \`${GITHUB_SHA:0:7}\` to the VPS after CI, ARM64 standalone smoke test, persistent-state snapshot/backup, clean PM2 activation, localhost health check, and post-activation state verification."
            echo
            echo "If activation fails, CD restarts the last-known-good release. SQLite integrity, tracked row counts, upload counts, and referenced music files are checked around activation; the pre-deploy SQLite backup is retained on failure."
            echo
            echo "The VPS keeps SQLite, backups, uploads/music, and .env under the persistent shared directory; releases are immutable and the latest five are retained."
          } >> "$GITHUB_STEP_SUMMARY"
