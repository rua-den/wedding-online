name: Upgrade runtime dependencies

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/upgrade-runtime-deps.yml

permissions:
  contents: write
  actions: write

env:
  CI: true
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  upgrade:
    name: Upgrade Next.js and image runtime
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Upgrade production runtime dependencies
        run: |
          set -euo pipefail
          npm install --save-exact next@16.3.6 sharp@0.35.4
          npm install --save-dev --save-exact eslint-config-next@16.3.6

      - name: Verify upgraded dependency graph
        run: |
          set -euo pipefail
          npm test
          npm run lint
          npm run build
          node -e "const p=require('./node_modules/next/package.json'); if(p.version!=='16.3.6') process.exit(1)"
          node -e "const p=require('./node_modules/sharp/package.json'); if(p.version!=='0.35.4') process.exit(1)"

      - name: Commit lockfile upgrade
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Dependencies already upgraded."
          else
            git commit -m "chore: upgrade Next.js security patch and sharp"
            git push origin HEAD:main
          fi
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref main -f deploy_to_vps=false
