map $scheme $wedding_hsts {
    default "";
    https "max-age=31536000";
}

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com www.your-domain.com;

    # HSTS is emitted only after TLS is enabled for this server by Certbot.
    add_header Strict-Transport-Security $wedding_hsts always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite client identity headers at the trusted proxy boundary.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
